project_name: aegis (Bhrmshree)
version: 1.0.0
description: An advanced AI Agent framework for automated Security Penetration Testing and Quality Assurance, orchestrating multiple Gemini-powered agents via Temporal.io and Playwright.
tech_stack:
  - Node.js & TypeScript
  - Temporal.io (Orchestration)
  - Playwright (Browser Automation)
  - @google/generative-ai (Gemini 3.1 Pro LLM)
  - Express.js & Socket.io (Backend & Real-time streaming)
  - Next.js 15, React, TailwindCSS, Lucide-react (Dashboard)
architecture_directories:
  - engine/agents: Contains Explorer (QA), Shadow (Security), Sweeper (Directory Fuzzing) agents.
  - engine/automation: Playwright browser wrapper.
  - engine/activities.ts & workflows.ts: Temporal workflow definitions.
  - engine/server.ts: Express API and Socket.io real-time bridge.
  - engine/llm-provider.ts: Gemini API wrapper with security safety overrides.
  - prompts: Master prompts for the agents in txt format.
  - dashboard: Next.js graphical interface for controlling scans and viewing live logs.
  - shared: TypeScript interfaces and shared types.
features:
  - 3-Stage Scan Pipeline: Discovery -> Security Probe -> Final Assurance.
  - Multi-turn LLM reasoning loops.
  - Live AI browser stream rendering to web dashboard via websockets.
  - AI-driven payload mutation and WAF bypassing instructions.
